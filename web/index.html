<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Minion Maze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap">
<style>
  :root {
    --bg: #0c0e19;
    --ground: #141729;
    --surface: #1c2036;
    --surface-2: #262b48;
    --line: #343a5c;
    --text: #f1f2f8;
    --muted: #9ba1bd;
    --accent: #ff8a3d;
    --accent-2: #ff4f7b;
    --player: #40a6ff;
    --enemy: #ff5959;
    --gold: #ffd94d;
    --gem: #7fe3ff;
    --good: #4cd964;
    --font: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    --emoji: system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .phone { position: relative; height: 100%; max-width: 430px; margin: 0 auto; background: var(--ground); display: flex; flex-direction: column; overflow: hidden; }
  @media (min-width: 480px) { .phone { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }

  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; padding: 16px; gap: 16px; }
  .screen.tight { padding: 0; gap: 0; overflow: hidden; }

  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .tiny { font-size: 11px; }
  .num { font-variant-numeric: tabular-nums; }
  .center { text-align: center; }

  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.08); font-weight: 700; font-size: 13px; }
  .pill.gold { color: var(--gold); }
  .wallet { display: flex; gap: 8px; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px 16px; border-radius: 16px; font-weight: 700; font-size: 16px; transition: transform 0.1s ease; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; }
  .btn.secondary { background: rgba(255,255,255,0.1); }
  .btn.sm { width: auto; padding: 7px 12px; border-radius: 999px; font-size: 12px; background: rgba(255,138,61,0.28); }
  .btn.sm.ghost { background: rgba(255,255,255,0.1); }
  .btn[disabled] { opacity: 0.45; cursor: default; transform: none; }

  .card { background: var(--surface); border-radius: 16px; padding: 14px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface); width: 100%; text-align: left; }
  .item.link:hover { background: var(--surface-2); }
  .item .sym { font-size: 28px; width: 40px; text-align: center; font-family: var(--emoji); flex: none; }
  @keyframes twinkle { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.45) saturate(1.2); } }
  @media (prefers-reduced-motion: reduce) { .item .sym { animation: none !important; } }
  .item .sym.dim { opacity: 0.35; }
  .item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .item .title { font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .item .sub { color: var(--muted); font-size: 12px; }
  .item .sub.warn { color: var(--accent); font-size: 11px; }
  .check { color: var(--good); font-weight: 900; }
  .lock { color: var(--muted); }

  .tag { font-size: 9px; font-weight: 900; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 999px; }

  .section-title { font-weight: 700; font-size: 15px; margin: 4px 0 0; display: flex; justify-content: space-between; align-items: baseline; }
  .section-title .muted { font-weight: 500; }

  .hero { text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .hero .logo { font-size: 48px; font-family: var(--emoji); }
  .hero h1 { margin: 0; font-size: 36px; font-weight: 900; letter-spacing: -0.02em; text-wrap: balance; }

  .squad-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
  .squad-strip::-webkit-scrollbar { display: none; }
  .slot-card { flex: none; width: 66px; height: 84px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; border: 1px solid var(--line); }
  .slot-card.empty { border: 1px dashed var(--line); color: var(--muted); font-size: 20px; background: transparent; }
  .slot-card .name { max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  canvas.pc { display: block; flex: none; }

  /* Battle */
  .hud { padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(#3d2a1b, #2a1b12); border-bottom: 2px solid #c9993a; box-shadow: inset 0 -1px 0 #7a5a26; }
  .hud.bottom { border-top: 2px solid #c9993a; border-bottom: 0; box-shadow: inset 0 1px 0 #7a5a26; }
  .hud .pill { background: rgba(0,0,0,0.35); border: 1px solid #7a5a26; }
  .hud .icon-btn { background: #c9993a; color: #2a1b12; }
  .hud .bar .track { height: 10px; background: #1a120c; border: 1px solid #0d0906; }
  .bar { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .bar .lbl { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; }
  .bar .track { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 999px; transition: width 0.2s ease; }
  .canvas-wrap { flex: 1; min-height: 260px; position: relative; background: #5a3d26; }
  #cv { display: block; width: 100%; height: 100%; }
  .spawn-strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .spawn-strip::-webkit-scrollbar { display: none; }
  .spawn { flex: none; width: 64px; height: 84px; border-radius: 12px; background: rgba(64,166,255,0.35); border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; font-weight: 700; }
  .spawn[disabled] { background: rgba(255,255,255,0.08); opacity: 0.5; }
  .spawn.empty { border-style: dashed; background: transparent; color: var(--muted); font-size: 18px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.12); display: grid; place-items: center; font-size: 14px; flex: none; }

  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 20; }
  .overlay.solid { background: #000; }
  .modal { background: var(--surface); border-radius: 20px; padding: 24px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
  .modal h2 { margin: 0; font-size: 24px; }
  .ad { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 16px; }
  .ad .badge { background: var(--gold); color: #000; font-weight: 900; font-size: 11px; padding: 4px 8px; border-radius: 4px; }
  .ad .count { font-size: 40px; font-weight: 900; color: var(--muted); height: 60px; display: grid; place-items: center; }

  .result-title { font-size: 44px; font-weight: 900; letter-spacing: -0.02em; margin: 0; }
  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; }
  .loot { border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 14px; border: 1px solid; }
  .loot .sym { font-size: 40px; font-family: var(--emoji); }
  .reveal { animation: reveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both; }
  @keyframes reveal { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }

  .chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; font-size: 11px; }
  .chip { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 44px; }
  .chip b { font-size: 13px; }
  .topbar { display: flex; align-items: center; gap: 10px; }
  .topbar h2 { margin: 0; font-size: 22px; flex: 1; }
  .banner { background: rgba(255,217,77,0.12); border: 1px solid rgba(255,217,77,0.35); border-radius: 12px; padding: 10px 12px; font-size: 12px; color: var(--gold); }
  .fitting { position: sticky; top: -16px; z-index: 4; margin: -6px -16px 0; border-radius: 0 0 16px 16px; padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); box-shadow: 0 8px 18px rgba(0,0,0,0.35); flex: none; }
  #coach { position: absolute; left: 12px; right: 12px; bottom: 14px; z-index: 30; background: var(--surface-2); border: 1px solid var(--gold); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  #coach.top { bottom: auto; top: 58px; }
  #errbar { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 60; background: #3a1418; border: 1px solid var(--enemy); border-radius: 12px; padding: 10px 12px; font-size: 12px; color: #ffd6d6; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  #coach .btn.sm { background: var(--gold); color: #1a1220; }
  #coach .btn.sm.ghost { background: rgba(255,255,255,0.1); color: var(--text); }
  .coach-hi { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 12px; animation: coachPulse 1.1s ease-in-out infinite; }
  @keyframes coachPulse { 0%, 100% { outline-color: var(--gold); box-shadow: 0 0 0 0 rgba(255,217,77,0.55); } 50% { outline-color: #fff2b0; box-shadow: 0 0 0 8px rgba(255,217,77,0); } }
  @media (prefers-reduced-motion: reduce) { .coach-hi { animation: none; } }
  .toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--surface-2); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,0.4); pointer-events: none; }

  /* Appearance editor */
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.08); font-weight: 700; font-size: 12px; }
  .tab.on { background: var(--accent); color: #fff; }
  select.tab { appearance: none; -webkit-appearance: none; border: 0; color: var(--text); padding-right: 22px; background: rgba(255,255,255,0.08) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0h10L5 6z' fill='%239ba1bd'/></svg>") no-repeat right 8px center; }
  select.tab option { background: var(--surface-2); color: var(--text); }
  .armory-tabs { flex: none; position: sticky; top: -16px; z-index: 5; margin: -6px -16px 0; padding: 8px 16px; background: var(--ground); border-bottom: 1px solid var(--line); }
  .armory-tabs .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 10px; min-width: 62px; font-size: 11px; }
  .armory-tabs .tab .ic { font-size: 16px; font-family: var(--emoji); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .cos { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 12px; background: var(--surface); border: 1.5px solid transparent; font-size: 11px; font-weight: 700; text-align: center; }
  .cos.on { border-color: var(--gold); }
  .cos .price { color: var(--gold); font-weight: 700; }
  .cos .owned { color: var(--muted); font-weight: 500; }
  .cos .name { max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); }
  .looks { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .looks::-webkit-scrollbar { display: none; }
  .look { flex: none; width: 128px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border-radius: 14px; background: var(--surface); text-align: center; }
  .look .name { font-weight: 700; font-size: 12px; }
  .look .tag { font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: 0; text-wrap: balance; }
</style>

<div class="phone" id="phone">
  <div id="screen" class="screen"></div>
  <div id="overlays"></div>
</div>

<script>
'use strict';

// ---------- Content (mirrors Catalog.swift and Balance.swift) ----------
const RARITY = [
  { name: 'Common', color: '#c9cbd8' },
  { name: 'Uncommon', color: '#4cd964' },
  { name: 'Rare', color: '#5b9cff' },
  { name: 'Epic', color: '#b46cff' },
  { name: 'Legendary', color: '#ff9f3d' },
  { name: 'Ultra', color: '#ff8de3' },   // prestige-only gear
];

// Six classes. Each beats one class (+25% damage) and loses to another, in a cycle:
// Pirates > Humans > Monsters > Wizards > Robots > Aliens > Pirates.
const CLASSES = {
  humans:   { name: 'Humans',   sym: '🧑‍🌾', color: '#5b9cff', passive: 'Rally',        blurb: '+6% damage per other Human within 2 tiles (up to +30%)', weakness: 'No tricks: only as strong as the squad around them', strong: 'zombies' },
  pirates:  { name: 'Pirates',  sym: '🏴‍☠️', color: '#ff9f3d', passive: 'Plunder',      blurb: 'Kills pay +40% coins. Quick on their feet',               weakness: 'Thin armor and low health',                            strong: 'humans' },
  monsters: { name: 'Monsters', sym: '👹', color: '#4cd964', passive: 'Regrowth',     blurb: 'Regenerate 1.5% health every second',                      weakness: 'Slow and short-reached',                               strong: 'pirates' },
  wizards:  { name: 'Wizards',  sym: '🧙', color: '#b46cff', passive: 'Arcane Chain', blurb: 'Every hit also strikes one nearby enemy for 40%',           weakness: 'Fragile and slow to cast',                             strong: 'ghosts' },
  ghosts:   { name: 'Ghosts',   sym: '👻', color: '#dfe6ff', passive: 'Terrify',      blurb: 'Enemies within 1.5 tiles of a Ghost deal 15% less damage', weakness: 'Low health, slow attacks',                             strong: 'robots' },
  robots:   { name: 'Robots',   sym: '🤖', color: '#9aa0b0', passive: 'Plating',      blurb: 'Block 20% of all damage',                                 weakness: 'Cannot be healed; slow',                               strong: 'aliens' },
  aliens:   { name: 'Aliens',   sym: '👽', color: '#7fe3ff', passive: 'Phase',        blurb: '20% chance to dodge any hit. Long reach',                  weakness: 'Very low health',                                      strong: 'ninjas' },
  ninjas:   { name: 'Ninjas',   sym: '🥷', color: '#c9c9d8', passive: 'Ambush',       blurb: 'The first hit on each new target lands for 2.5× damage. Fast', weakness: 'Very low health, no armor',                        strong: 'vampires' },
  vampires: { name: 'Vampires', sym: '🧛', color: '#ff5c8a', passive: 'Bloodthirst',  blurb: 'Heal 30% of the damage they deal. Fast',                   weakness: 'Low health; nothing to drink from Robots',             strong: 'monsters' },
  zombies:  { name: 'Zombies',  sym: '🧟', color: '#8fbf3f', passive: 'Rise Again',   blurb: '30% chance to get back up once at 40% health. Cheap',      weakness: 'Very slow, weak hits',                                 strong: 'wizards' },
};
const CLASS_IDS = Object.keys(CLASSES);
const weakTo = cls => CLASS_IDS.find(k => CLASSES[k].strong === cls);

const MINIONS = [
  // Humans: balanced, better together
  { id: 'militia', name: 'Militia', sym: '🧑‍🌾', cls: 'humans', rarity: 0, hp: 60, dmg: 8, atk: 1.0, range: 0.9, speed: 1.6, cost: 20, lvl: 1, blurb: 'Farmers with pitchforks and a plan.' },
  { id: 'archer', name: 'Archer', sym: '🏹', cls: 'humans', rarity: 1, hp: 70, dmg: 14, atk: 1.1, range: 2.4, speed: 1.5, cost: 48, lvl: 2, blurb: 'Steady aim from the back rank.' },
  { id: 'knight', name: 'Knight', sym: '🐴', cls: 'humans', rarity: 2, hp: 230, dmg: 18, atk: 1.2, range: 1.0, speed: 1.3, cost: 100, lvl: 7, blurb: 'Armoured cavalry that leads the charge.' },
  // Pirates: fast, greedy, thin
  { id: 'deckhand', name: 'Deckhand', sym: '🏴‍☠️', cls: 'pirates', rarity: 0, hp: 50, dmg: 9, atk: 0.9, range: 0.9, speed: 2.0, cost: 20, lvl: 3, blurb: 'Cutlass first, questions never.' },
  { id: 'musketeer', name: 'Musketeer', sym: '🔫', cls: 'pirates', rarity: 1, hp: 60, dmg: 17, atk: 1.3, range: 2.2, speed: 1.6, cost: 48, lvl: 5, blurb: 'One shot, then a long reload.' },
  { id: 'captain', name: 'Captain', sym: '☠️', cls: 'pirates', rarity: 2, hp: 180, dmg: 22, atk: 1.1, range: 1.0, speed: 1.5, cost: 100, lvl: 8, blurb: 'Fights dirty and gets paid.' },
  // Monsters: slow, tough, regenerating
  { id: 'ghoul', name: 'Ghoul', sym: '👹', cls: 'monsters', rarity: 0, hp: 80, dmg: 7, atk: 1.2, range: 0.8, speed: 1.3, cost: 20, lvl: 4, blurb: 'Shambles forward and keeps coming.' },
  { id: 'brute', name: 'Brute', sym: '🧟', cls: 'monsters', rarity: 1, hp: 140, dmg: 11, atk: 1.5, range: 0.9, speed: 1.0, cost: 50, lvl: 6, blurb: 'A wall of muscle that holds a lane.' },
  { id: 'behemoth', name: 'Behemoth', sym: '👿', cls: 'monsters', rarity: 2, hp: 300, dmg: 22, atk: 1.8, range: 1.0, speed: 0.8, cost: 110, lvl: 10, blurb: 'The ground shakes.' },
  // Wizards: glass cannons that hit twice
  { id: 'apprentice', name: 'Apprentice', sym: '🪄', cls: 'wizards', rarity: 0, hp: 40, dmg: 13, atk: 1.5, range: 2.0, speed: 1.4, cost: 22, lvl: 8, blurb: 'Still learning. Still dangerous.' },
  { id: 'sorcerer', name: 'Sorcerer', sym: '🔮', cls: 'wizards', rarity: 1, hp: 55, dmg: 22, atk: 1.7, range: 2.3, speed: 1.3, cost: 50, lvl: 10, blurb: 'Bends the lane to their will.' },
  { id: 'archmage', name: 'Archmage', sym: '🧙', cls: 'wizards', rarity: 2, hp: 120, dmg: 45, atk: 2.0, range: 2.5, speed: 1.1, cost: 110, lvl: 13, blurb: 'Rewrites the rules of the fight.' },
  // Robots: plated, slow, unhealable
  { id: 'drone', name: 'Drone', sym: '🛰️', cls: 'robots', rarity: 0, hp: 45, dmg: 9, atk: 1.0, range: 1.4, speed: 1.4, cost: 22, lvl: 6, blurb: 'Cheap, plated, relentless.' },
  { id: 'enforcer', name: 'Enforcer', sym: '🤖', cls: 'robots', rarity: 1, hp: 95, dmg: 12, atk: 1.3, range: 1.0, speed: 1.0, cost: 50, lvl: 9, blurb: 'Built to hold the line.' },
  { id: 'titan', name: 'Titan', sym: '🦾', cls: 'robots', rarity: 2, hp: 240, dmg: 22, atk: 1.7, range: 1.1, speed: 0.7, cost: 110, lvl: 12, blurb: 'A walking bunker.' },
  // Aliens: slippery, long-ranged, frail
  { id: 'scout', name: 'Scout', sym: '👽', cls: 'aliens', rarity: 0, hp: 35, dmg: 9, atk: 0.9, range: 1.8, speed: 2.2, cost: 22, lvl: 9, blurb: 'Hard to hit, easy to lose.' },
  { id: 'saucer', name: 'Saucer', sym: '🛸', cls: 'aliens', rarity: 1, hp: 55, dmg: 13, atk: 1.0, range: 2.6, speed: 1.4, cost: 50, lvl: 12, blurb: 'Fires from well outside reach.' },
  { id: 'overlord', name: 'Overlord', sym: '🐙', cls: 'aliens', rarity: 2, hp: 150, dmg: 30, atk: 1.4, range: 2.2, speed: 1.2, cost: 110, lvl: 14, blurb: 'Thinks three moves ahead.' },
  // Vampires: fast predators that feed as they fight
  { id: 'thrall', name: 'Thrall', sym: '🦇', cls: 'vampires', rarity: 0, hp: 45, dmg: 10, atk: 0.9, range: 0.9, speed: 2.0, cost: 22, lvl: 10, blurb: 'Hungry, quick, disposable.' },
  { id: 'nightstalker', name: 'Nightstalker', sym: '🧛', cls: 'vampires', rarity: 1, hp: 65, dmg: 16, atk: 1.1, range: 1.0, speed: 1.8, cost: 50, lvl: 12, blurb: 'Arrives before you hear it.' },

  let a = seed >>> 0;

    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

function reportError(where, e) {
  const stack = String(e && e.stack || '').split(String.fromCharCode(10)).slice(0, 3).join(' | ');
  const text = where + ': ' + String(e && e.message || e) + (stack ? '  [' + stack.slice(0, 260) + ']' : '');
  try { localStorage.setItem(ERR_KEY, JSON.stringify({ text, when: new Date().toISOString() })); } catch (x) { /* no storage */ }
  showErrorBar(text);
  return text;
}
function lastError() { try { return JSON.parse(localStorage.getItem(ERR_KEY) || 'null'); } catch (x) { return null; } }
function clearLastError() { try { localStorage.removeItem(ERR_KEY); } catch (x) { /* no storage */ } const b = document.getElementById('errbar'); if (b) b.remove(); }
function showErrorBar(text) {
  let bar = document.getElementById('errbar');
  if (!bar) { bar = document.createElement('div'); bar.id = 'errbar'; (document.getElementById('phone') || document.body).appendChild(bar); }
  bar.innerHTML = '<div class="row" style="align-items:flex-start"><span style="font-size:18px">⚠️</span><div class="grow" style="user-select:text;-webkit-user-select:text;word-break:break-word"><b>Error</b> · please report this text<br>' + esc(text) + '</div><button class="icon-btn" id="errClose" aria-label="Dismiss">✕</button></div>';
  bar.querySelector('#errClose').onclick = clearLastError;
}

function applyDecay() {

function boostedStats(m) {

}
/// Both commanders send a wave at the same moment. Units trickle out a quarter second apart so they do not stack.

  return `<button class="item link" data-equip-best ${n ? '' : 'disabled'} style="border:1px solid ${n ? 'var(--gold)' : 'var(--line)'}"><div class="sym">📺</div><div class="body"><div class="title">Equip best${n ? ` <span class="tag" style="background:rgba(255,217,77,.2);color:var(--gold)">${n} CHANGE${n === 1 ? '' : 'S'}</span>` : ''}</div><div class="sub">${n ? `Watch an ad and the strongest piece you own goes into every slot: ${n} change${n === 1 ? '' : 's'} on ${who} minion${who === 1 ? '' : 's'}.` : `${whom || 'Everyone'} already wears the best you own in every slot.`}</div></div><b class="small">${n ? 'Watch ad' : ''}</b></button>`;
}
function equipBestViaAd(mids, after) {
  if (!equipBestPlan(mids).length) return;

    if (!ok) { toast('No change. Watch the whole ad to equip the best gear.'); return; }

    after();

    const byMinion = {}; for (const x of plan) (byMinion[x.mid] = byMinion[x.mid] || []).push(x);
    const rows = Object.entries(byMinion).map(([mid, xs]) => { const m = MINION_BY[mid]; return `<div style="text-align:left;padding:6px 0;border-bottom:1px solid var(--line)"><div class="row" style="gap:8px"><span style="font-size:20px;font-family:var(--emoji)">${m.sym}</span><b>${esc(m.name)}</b></div>${xs.map(x => `<div class="tiny row" style="gap:6px;padding-left:28px"><span class="muted">${SLOT_INFO[x.slot].icon} ${SLOT_INFO[x.slot].name}:</span><span class="muted">${x.from ? esc(x.from.name) : 'nothing'}</span><span>→</span><span style="color:${x.to && x.to.cls === m.cls ? CLASSES[m.cls].color : 'var(--text)'}">${x.to ? esc(x.to.name) + (x.to.cls === m.cls ? ' ✓' : '') : 'nothing'}</span> ${x.to ? rarityTag(effectiveRarity(x.to)) : ''}</div>`).join('')}</div>`; }).join('');
    modal(`Equipped ${plan.length} piece${plan.length === 1 ? '' : 's'}`, `<div style="max-height:50vh;overflow-y:auto">${rows}</div><div class="muted tiny" style="margin-top:8px">${who} minion${who === 1 ? '' : 's'} changed. ✓ marks a piece made for that class.</div>`, [{ label: 'Nice', style: 'primary' }]);

}
// ---------- Auto squad: the strongest owned minions fill the squad, for a rewarded ad ----------
/// How strong a minion is right now: health times damage per second, with gear, stars, upgrades and class drills counted.
const unitPower = m => { const s = playerStats(m); return s.hp * (s.dmg / s.atk) * (1 + Math.max(0, s.range - 1) * 0.1) * (1 + s.armor); };
const autoSquadPlan = () => P.unlockedMinions.map(id => MINION_BY[id]).filter(Boolean).sort((a, b) => unitPower(b) - unitPower(a)).slice(0, P.squadSlots).map(m => m.id);
const autoSquadChanges = () => { const plan = autoSquadPlan(); return plan.filter(id => !P.squad.includes(id)).length + P.squad.filter(id => !plan.includes(id)).length; };
function autoSquadHTML() {
  const n = autoSquadChanges(), plan = autoSquadPlan();
  return `<button class="item link" data-auto-squad ${n ? '' : 'disabled'} style="border:1px solid ${n ? 'var(--gold)' : 'var(--line)'}"><div class="sym">📺</div><div class="body"><div class="title">Auto squad${n ? ` <span class="tag" style="background:rgba(255,217,77,.2);color:var(--gold)">${n} SWAP${n === 1 ? '' : 'S'}</span>` : ''}</div><div class="sub">${n ? `Watch an ad and your ${plan.length} strongest minions take the field: ${plan.map(id => MINION_BY[id].name).join(', ')}.` : 'Your squad is already your strongest lineup.'}</div></div><b class="small">${n ? 'Watch ad' : ''}</b></button>`;
}
function autoSquadViaAd() {
  if (!autoSquadChanges()) return;
  showAd('rewarded', ok => {
    if (!ok) { toast('No change. Watch the whole ad to build the squad.'); return; }
    const before = P.squad.slice(); P.squad = autoSquadPlan(); save(); renderArmory();
    // Show the new lineup and who came in or sat out.
    const joined = P.squad.filter(id => !before.includes(id)), left = before.filter(id => !P.squad.includes(id));
    const line = ids => ids.length ? ids.map(id => `<span class="row" style="display:inline-flex;gap:4px;margin:2px 6px 2px 0"><span style="font-family:var(--emoji)">${MINION_BY[id].sym}</span>${esc(MINION_BY[id].name)}</span>`).join('') : '<span class="muted">nobody</span>';
    modal('Squad rebuilt', `<div style="text-align:left"><div class="tiny muted" style="margin-bottom:4px">NEW LINEUP · strongest first</div><div>${P.squad.map((id, i) => `<div class="row" style="gap:8px;padding:4px 0"><span class="muted tiny">${i + 1}</span><span style="font-size:18px;font-family:var(--emoji)">${MINION_BY[id].sym}</span><b>${esc(MINION_BY[id].name)}</b> ${rarityTag(effectiveRarity(MINION_BY[id]))}<span class="muted tiny">power ${Math.round(unitPower(MINION_BY[id]))}</span></div>`).join('')}</div><div class="tiny" style="margin-top:8px;color:var(--good)">Joined: ${line(joined)}</div><div class="tiny" style="margin-top:4px;color:var(--enemy)">Sat out: ${line(left)}</div></div>`, [{ label: 'Nice', style: 'primary' }]);
  });
}

let styleTab = 'hair';
function renderStyle(m) {
  const st = styleFor(m.id), worn = gearFor(m.id);
  const lookCost = look => Object.values(look.style).reduce((a, id) => a + (ownsCosmetic(id) ? 0 : COS[id].price), 0);
  const isLook = look => Object.entries(look.style).every(([k, v]) => st[k] === v);
  show(`
    <div class="topbar"><button class="icon-btn" id="back" aria-label="Back">←</button><h2>Appearance</h2>${walletHTML()}</div>
    <div class="card center" style="display:flex;flex-direction:column;align-items:center;gap:4px">

      <div class="muted tiny">Every piece you pick is worn on the battlefield.</div>
    </div>
    <div class="section-title">Looks <span class="muted small">one tap, buys any missing pieces</span></div>
    <div class="looks">${LOOKS.map((l, i) => { const cost = lookCost(l), on = isLook(l); return `<div class="look" style="${on ? 'outline:1.5px solid var(--gold)' : ''}">${portrait(m, worn, 26, { style: Object.assign({}, st, l.style), badge: false })}<div class="name">${l.name}</div><div class="tag">${l.tag}</div><button class="btn sm" data-look="${i}" ${on ? 'disabled' : ''}>${on ? 'Wearing' : cost ? '🪙 ' + cost : 'Apply'}</button></div>`; }).join('')}</div>
    <div class="section-title">Piece by piece</div>
    <div class="tabs">${LAYERS.map(l => `<button class="tab ${styleTab === l.id ? 'on' : ''}" data-tab="${l.id}">${l.name}</button>`).join('')}</div>
    <div class="grid">${COSMETICS.filter(c => c.layer === styleTab).map(c => {
      const on = st[styleTab] === c.id, owned = ownsCosmetic(c.id);
      const preview = c.hex && (c.layer === 'skin' || c.layer === 'hairColor' || c.layer === 'outfit' || c.layer === 'cape')
        ? `<div class="swatch" style="background:${c.hex}"></div>`
        : c.layer === 'emblem' ? `<div class="swatch" style="display:grid;place-items:center;font-size:18px;font-family:var(--emoji)">${c.sym || '∅'}</div>`
        : portrait(m, [], 18, { style: Object.assign({}, st, { [styleTab]: c.id }), badge: false });
      return `<button class="cos ${on ? 'on' : ''}" data-cos="${c.id}">${preview}<div class="name">${c.name}</div><div class="${owned ? 'owned' : 'price'}">${on ? '✓ Wearing' : owned ? 'Owned' : '🪙 ' + c.price}</div></button>`;
    }).join('')}</div>
    <div class="muted tiny">Designs are original. Names and shapes are generic archetypes, not any specific franchise character.</div>
  `);
  $('#back').onclick = () => renderLoadout(m);
  screen.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { styleTab = b.dataset.tab; const y = screen.scrollTop; renderStyle(m); screen.scrollTop = y; });
  screen.querySelectorAll('[data-cos]').forEach(b => b.onclick = () => {
    const id = b.dataset.cos, c = COS[id];
    if (!ownsCosmetic(id)) { if (!buyCosmetic(id)) { toast('Not enough coins. Win rounds or watch an ad.'); return; } toast('Bought ' + c.name + ' for 🪙 ' + c.price); }
    setStyle(m.id, c.layer, id); const y = screen.scrollTop; renderStyle(m); screen.scrollTop = y;
  });
  screen.querySelectorAll('[data-look]').forEach(b => b.onclick = () => {
    const look = LOOKS[+b.dataset.look], cost = lookCost(look);

    toast(cost ? `${look.name} applied for 🪙 ${cost}` : `${look.name} applied`);
    const y = screen.scrollTop; renderStyle(m); screen.scrollTop = y;
  });
}

    </div>
    <div class="section-title">Ranks <span class="muted small">${TIERS.filter(t => t[0] <= L.level).length} of ${TIERS.length}</span></div>
    <div class="list">${TIERS.map(([lv, name], i) => { const reached = L.level >= lv; return `<div class="item" style="${reached ? '' : 'opacity:.55'}"><div class="sym">${TIER_ICONS[i]}</div><div class="body"><div class="title">${name} <span class="muted small">Lv ${lv}+</span></div><div class="sub">+${Math.round(XP.perLevel * (lv - 1) * 100)}% coins at Lv ${lv} · rare+ loot odds ${Math.round(rareChance(P.matches, lv) * 100)}%</div></div>${reached ? '<span class="check">✓</span>' : ''}</div>`; }).join('')}</div>
    <div class="muted tiny">The iPhone app can send a reminder before a streak ends; turn it on from this screen there.</div>
  `);
  $('#back').onclick = renderMenu;
}

// -- Shop
const PRODUCTS = [
  { id: 'gems100', name: 'Pouch of Gems', desc: 'A pouch of 100 gems.', price: '$0.99', gems: 100 },
  { id: 'gems550', name: 'Chest of Gems', desc: 'A chest of 550 gems.', price: '$4.99', gems: 550 },
  { id: 'gems1200', name: 'Vault of Gems', desc: 'A vault of 1200 gems.', price: '$9.99', gems: 1200 },
];
function renderShop() {
  const row = (icon, t, s) => `<div class="sym">${icon}</div><div class="body"><div class="title">${t}</div><div class="sub">${s}</div></div>`;
  show(`
    <div class="topbar"><button class="icon-btn" id="back" aria-label="Back">←</button><h2>Shop</h2>${walletHTML()}</div>
    <div class="section-title">Free</div>
    <div class="list"><button class="item link" id="watchAd">${row('📺', 'Watch an ad', 'Earn ' + B.adCoins + ' coins')}</button></div>
    <div class="section-title">Gems</div>
    <div class="list">
      ${PRODUCTS.map(p => `<button class="item link" data-buy="${p.id}">${row('💎', p.name, p.desc)}<b>${p.price}</b></button>`).join('')}
      <button class="item link" id="exchange" ${P.gems >= B.gemsPerExchange ? '' : 'disabled'}>${row('🔁', 'Exchange ' + B.gemsPerExchange + ' gems', 'Receive ' + B.coinsPerExchange + ' coins')}</button>
    </div>
    <div class="section-title">Ads</div>
    <div class="list">
      ${P.adsRemoved ? `<div class="item"><div class="sym">✅</div><div class="body" style="color:var(--good)">Ads removed forever. Thank you!</div></div>` : `
      ${adsOff() ? `<div class="item"><div class="sym">✅</div><div class="body" style="color:var(--good)">No-ads pass active until ${new Date(P.adsUntil).toLocaleDateString()}</div></div>` : ''}
      <button class="item link" data-buy="noads_month">${row('📅', adsOff() ? 'Extend the no-ads pass' : 'Remove ads for a month', 'No ads before rounds for 30 days. Renews monthly; cancel any time.')}<b>$2.99<span class="muted tiny">/mo</span></b></button>
      <button class="item link" data-buy="noads_forever">${row('🚫', 'Remove ads forever', 'One payment, no ads ever again.')}<b>$49.99</b></button>`}
    </div>
    <div class="muted tiny">Purchases here are simulated. The iPhone app uses StoreKit 2 with real App Store products.</div>
    <div class="section-title">Preview tools</div>
    <div class="list">
      <button class="item link" id="cheat">${row('🧪', 'Add 2,000 coins', 'Preview only: try looks and upgrades quickly')}</button>
      <button class="item link" id="dupes">${row('🎁', 'Add 5 copies of everything owned', 'Preview only: try merging and ascending')}</button>
      <button class="item link" id="away">${row('📆', 'Simulate 4 days away', 'Preview only: see the commander decay in action')}</button>
      <button class="item link" id="reset">${row('🗑️', 'Reset progress', 'Start over from round 1 with the starter squad')}</button>
    </div>
  `);
  $('#back').onclick = renderMenu;
  $('#watchAd').onclick = () => showAd('rewarded', ok => { if (ok) { P.coins += B.adCoins; save(); toast('+' + B.adCoins + ' coins added'); } else toast('No reward. Watch the whole ad to earn coins.'); renderShop(); });
  $('#exchange').onclick = () => { if (P.gems >= B.gemsPerExchange) { P.gems -= B.gemsPerExchange; P.coins += B.coinsPerExchange; save(); renderShop(); } };
  $('#cheat').onclick = () => { P.coins += 2000; save(); toast('+2,000 preview coins'); renderShop(); };
  $('#dupes').onclick = () => { P.copies = P.copies || {}; for (const id of [...P.unlockedMinions, ...P.unlockedGear]) P.copies[id] = copiesOf(id) + 5; save(); toast('Duplicates added. Merge them in the Armory.'); renderShop(); };
  $('#away').onclick = () => { if (!P.lastPlayed) { toast('Play a match first so there is something to decay.'); return; } P.lastPlayed = shiftDay(P.lastPlayed, -4); P.decayApplied = 0; save(); const d = applyDecay(); toast(d ? 'Lost ' + d.lost + ' XP to decay' : 'Nothing to decay'); renderMenu(); };
  $('#reset').onclick = () => modal('Reset progress?', 'This wipes coins, gems, unlocks, gear and looks in this browser.', [{ label: 'Reset', style: 'primary', onClick: () => { P = defaultProfile(); save(); renderMenu(); } }, { label: 'Cancel' }]);
  screen.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const id = b.dataset.buy, p = PRODUCTS.find(x => x.id === id);
    const label = p ? p.name + ' for ' + p.price : id === 'noads_month' ? 'No-ads pass for $2.99 a month' : 'Remove ads forever for $49.99';
    modal('Simulated purchase', `${label}. In the real app this opens the App Store payment sheet.`, [
      { label: 'Confirm purchase', style: 'primary', onClick: () => { if (p) P.gems += p.gems; else if (id === 'noads_month') P.adsUntil = Math.max(Date.now(), P.adsUntil || 0) + MONTH_MS; else P.adsRemoved = true; save(); toast(p ? '+' + p.gems + ' gems' : id === 'noads_month' ? 'No ads for 30 days' : 'Ads removed forever'); renderShop(); } },
      { label: 'Cancel' },
    ]);
  });
}

renderMenu();
</script>

</body></html>
